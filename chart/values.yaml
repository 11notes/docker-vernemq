image:
  repository: 11notes/vernemq
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
nameOverride: ""
fullnameOverride: ""
timezone: ""

extraEnv: []

service:
  type: ClusterIP
  ports:
    mqtts: 8883
    ui: 8888
  annotations: {}

redis:
  service: "redis"
  port: 6379
  secretName: ""

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

persistence:
  vernemq:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 16Gi

secretMounts:
  - name: "tls"
    secretName: ""

readinessProbe:
  exec:
    command:
      - localhealth
      - http://127.0.0.1:8080/health/listeners
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  exec:
    command:
      - localhealth
      - http://127.0.0.1:8080/health/listeners
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}