apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include (printf "%s.fullname" .Chart.Name) . }}
  labels:
    {{- include (printf "%s.labels" .Chart.Name) . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include (printf "%s.selectorLabels" .Chart.Name) . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include (printf "%s.selectorLabels" .Chart.Name) . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: pvc-copy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: "Always"
          args: 
            - "--pvc-copy"
          volumeMounts:
            - name: vernemq
              mountPath: /pvc
          securityContext:
            runAsUser: 0
        - name: chown
          image: "11notes/k8s-init"
          imagePullPolicy: "Always"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName | quote }}
                  key: "REDIS_PASSWORD"
          command:
            - sh
            - -c
            - |
              mkdir -p /pvc/vernemq/etc
              mkdir -p /pvc/vernemq/var
              eleven k8s chown /pvc {{ .Values.containerSecurityContext.runAsUser | default 1000 }} {{ .Values.containerSecurityContext.runAsGroup | default 1000 }}
              eleven k8s chown /opt {{ .Values.containerSecurityContext.runAsUser | default 1000 }} {{ .Values.containerSecurityContext.runAsGroup | default 1000 }}
              chmod 0750 -R /pvc/vernemq
              chmod 0750 -R /opt/vernemq
              eleven k8s wait redis {{ .Values.redis.service }} {{ .Values.redis.port }} ${REDIS_PASSWORD}
          volumeMounts:
            - name: vernemq
              mountPath: /pvc/vernemq
          securityContext:
            runAsUser: 0
      containers:
        - name: vernemq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: TZ
              value: {{ .Values.timezone | default "Europe/Zurich" | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.service | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName | quote }}
                  key: "REDIS_PASSWORD"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: mqtts
              containerPort: 8883
              protocol: TCP
            - name: ui
              containerPort: 8888
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: vernemq
              mountPath: /vernemq
          {{- with .Values.secretMounts }}
            {{- range . }}
            - name: {{ .name }}
              mountPath: /opt/vernemq/ssl
              readOnly: true
            {{- end }}
          {{- end }}
      volumes:
        {{- range $vol, $cfg := $.Values.persistence }}
        - name: {{ $vol }}
          {{- if $cfg.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vernemq.claimName" (list $ $vol) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.secretMounts }}
        {{- range . }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
